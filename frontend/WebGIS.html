<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebGIS ایران - بر اساس سرانه جمعیت + پروژه‌های آموزشی</title>
    <script>
    /* Apply saved language BEFORE first paint to avoid FA→EN flash */
    (function () {
        var KEY = 'classchain-language';
        var lang = 'fa';
        try {
            var s = localStorage.getItem(KEY);
            if (s === 'en' || s === 'ar' || s === 'fa') lang = s;
        } catch (e) {}
        document.documentElement.lang = lang;
        document.documentElement.dir = (lang === 'en') ? 'ltr' : 'rtl';
        document.documentElement.setAttribute('data-lang', lang);
    })();
    </script>
    <style>
        /* Hide translated nodes until language is applied (non-fa only) */
        html[data-lang]:not([data-lang="fa"]):not(.i18n-ready) [data-i18n] { visibility: hidden; }
        html.i18n-ready [data-i18n] { visibility: visible; }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="css/Style-GIS.css">
</head>
<body>
    <header class="gis-site-header" id="gisSiteHeader">
        <div class="gis-header-inner">
            <nav class="gis-nav">
                <div class="gis-nav-start">
                    <a href="../index.html" class="gis-brand" aria-label="خانه / ClassChain">
                        <span class="gis-brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 3.2 3 11h2.5v8.5h4.2V14h4.6v5.5h4.2V11H21L12 3.2z"/></svg></span>
                        <span class="gis-brand-text">کلاس‌چِین</span>
                    </a>
                </div>
                <div class="gis-nav-end">
                    <div class="gis-desktop-links gis-desktop-only">
                        <button type="button" class="gis-nav-link gis-nav-btn is-active" id="navMapBtn" data-i18n="nav.webgis">نقشه پروژه‌ها</button>
                        <a href="donate.html" class="gis-nav-link" id="navDonateLink" data-i18n="nav.cta">مشارکت</a>
                    </div>
                    <div class="gis-language-switcher">
                        <button class="gis-language-button" id="languageButton" type="button" aria-label="Language" aria-expanded="false">FA</button>
                        <div class="gis-language-menu" id="languageMenu">
                            <button type="button" data-lang="fa">فارسی</button>
                            <button type="button" data-lang="en">English</button>
                            <button type="button" data-lang="ar">العربية</button>
                        </div>
                    </div>
                    <button class="gis-mobile-menu-button gis-mobile-only" id="mobileMenuButton" type="button" aria-label="Menu">☰</button>
                </div>
            </nav>
            <div class="gis-mobile-menu" id="mobileMenu">
                <button type="button" class="gis-mobile-menu-item" id="navMapBtnMobile" data-i18n="nav.webgis">نقشه پروژه‌ها</button>
                <a href="donate.html" class="gis-mobile-menu-item" id="navDonateLinkMobile" data-i18n="nav.cta">مشارکت</a>
            </div>
        </div>
    </header>
    <script>
    /* Sync nav labels from localStorage before heavy map scripts */
    (function () {
        var lang = document.documentElement.getAttribute('data-lang') || 'fa';
        var dict = {
            fa: { langName: 'FA', 'nav.webgis': 'نقشه پروژه‌ها', 'nav.cta': 'مشارکت' },
            en: { langName: 'EN', 'nav.webgis': 'Project Map', 'nav.cta': 'Contribute' },
            ar: { langName: 'AR', 'nav.webgis': 'خريطة المشاريع', 'nav.cta': 'ساهم الآن' }
        };
        var d = dict[lang] || dict.fa;
        document.querySelectorAll('[data-i18n]').forEach(function (el) {
            var k = el.getAttribute('data-i18n');
            if (d[k] != null) el.textContent = d[k];
        });
        var btn = document.getElementById('languageButton');
        if (btn) btn.textContent = d.langName;
        document.documentElement.classList.add('i18n-ready');
    })();
    </script>

    <div class="container">
        <div id="map"></div>

        <div class="left-map-controls" id="leftMapControls">
            <button class="map-ctrl-btn" type="button" id="homeBtn" title="بازگشت به ایران" aria-label="بازگشت به ایران">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
            </button>
            <button class="map-ctrl-btn" type="button" id="zoomInBtn" title="بزرگ‌نمایی" aria-label="بزرگ‌نمایی">+</button>
            <button class="map-ctrl-btn" type="button" id="zoomOutBtn" title="کوچک‌نمایی" aria-label="کوچک‌نمایی">−</button>
        </div>

        <div class="map-controls">
            <button class="layers-btn" id="layersBtn" type="button" title="تغییر نوع نقشه" aria-label="انتخاب نوع نقشه" aria-expanded="false">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
                    <path d="M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27zM12 16l7.36-5.73L21 9l-9-7-9 7 1.63 1.27L12 16zm0-11.47L17.74 9 12 13.47 6.26 9 12 4.53z"/>
                </svg>
            </button>
            <div class="basemap-popup" id="basemapPopup" role="menu" hidden>
                <button type="button" class="basemap-option active" data-value="carto" role="menuitem">
                    <span class="basemap-swatch carto"></span>
                    <span>رنگارنگ (پیش‌فرض)</span>
                </button>
                <button type="button" class="basemap-option" data-value="persiangis" role="menuitem">
                    <span class="basemap-swatch persiangis"></span>
                    <span>نقشه فارسی</span>
                </button>
                <button type="button" class="basemap-option" data-value="satellite" role="menuitem">
                    <span class="basemap-swatch satellite"></span>
                    <span>ماهواره‌ای</span>
                </button>
                <button type="button" class="basemap-option" data-value="light" role="menuitem">
                    <span class="basemap-swatch light"></span>
                    <span>خاکستری روشن</span>
                </button>
                <button type="button" class="basemap-option" data-value="osm" role="menuitem">
                    <span class="basemap-swatch osm"></span>
                    <span>استاندارد (OSM)</span>
                </button>
            </div>
        </div>

        <div class="info-panel panel-peek" id="infoPanelWrapper">
            <div class="panel-header" id="panelHeader">
                <div class="drag-handle" id="dragHandle" aria-hidden="true"></div>
                <h1>WebGIS ایران</h1>
                <p>رنگ بر اساس سرانه جمعیت + پروژه‌های آموزشی</p>
            </div>
            <div class="panel-content" id="infoPanel">
                <div class="no-selection">
                    <div class="icon">🗺️</div>
                    <h3>یک مورد را انتخاب کنید</h3>
                    <p>روی استان، شهرستان یا پروژه کلیک کنید</p>
                </div>
            </div>
            <div class="fixed-contribute-button" id="fixedContributeBtn">
                <button type="button" id="contributeActionBtn">مشارکت در ساخت</button>
                <p>(انتخاب شبکه و پرداخت با کیف پول)</p>
            </div>
        </div>
    </div>

    <script src="js/gis-header.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
    <script src="js/network-config.js"></script>
    <script src="js/raised-reader.js"></script>
    <script src="js/donor-reader.js"></script>
    <script src="js/Script-GIS.js"></script>
</body>
</html>
