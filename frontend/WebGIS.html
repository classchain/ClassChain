<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebGIS ایران - بر اساس سرانه جمعیت + پروژه‌های آموزشی</title>
    <script>
    (function () {
        var KEY = 'classchain-language';
        var lang = 'fa';
        try {
            var s = localStorage.getItem(KEY);
            if (s === 'en' || s === 'ar' || s === 'fa') lang = s;
        } catch (e) {}
        document.documentElement.lang = lang;
        document.documentElement.dir = (lang === 'en') ? 'ltr' : 'rtl';
        document.documentElement.setAttribute('data-lang', lang);
    })();
    </script>
    <style>
        html[data-lang]:not([data-lang="fa"]):not(.i18n-ready) [data-i18n] { visibility: hidden; }
        html.i18n-ready [data-i18n] { visibility: visible; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="css/Style-GIS.css">
</head>
<body>
    <header class="gis-site-header" id="gisSiteHeader">
        <div class="gis-header-inner">
            <nav class="gis-nav">
                <div class="gis-nav-start">
                    <a href="../index.html" class="gis-brand" aria-label="خانه / ClassChain">
                        <span class="gis-brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 3.2 3 11h2.5v8.5h4.2V14h4.6v5.5h4.2V11H21L12 3.2z"/></svg></span>
                        <span class="gis-brand-text">کلاس‌چِین</span>
                    </a>
                </div>
                <div class="gis-nav-end">
                    <div class="gis-desktop-links gis-desktop-only">
                        <button type="button" class="gis-nav-link gis-nav-btn is-active" id="navMapBtn" data-i18n="nav.webgis">نقشه پروژه‌ها</button>
                        <a href="donate.html?project=GENERAL_POOL" class="gis-nav-link" id="navDonateLink" data-i18n="nav.cta">مشارکت</a>
                    </div>
                    <div class="gis-language-switcher">
                        <button class="gis-language-button" id="languageButton" type="button" aria-label="Language" aria-expanded="false">FA</button>
                        <div class="gis-language-menu" id="languageMenu">
                            <button type="button" data-lang="fa">فارسی</button>
                            <button type="button" data-lang="en">English</button>
                            <button type="button" data-lang="ar">العربية</button>
                        </div>
                    </div>
                    <button class="gis-mobile-menu-button gis-mobile-only" id="mobileMenuButton" type="button" aria-label="Menu">☰</button>
                </div>
            </nav>
            <div class="gis-mobile-menu" id="mobileMenu">
                <button type="button" class="gis-mobile-menu-item" id="navMapBtnMobile" data-i18n="nav.webgis">نقشه پروژه‌ها</button>
                <a href="donate.html?project=GENERAL_POOL" class="gis-mobile-menu-item" id="navDonateLinkMobile" data-i18n="nav.cta">مشارکت</a>
            </div>
        </div>
    </header>

    <div class="container">
        <div id="map"></div>

        <div class="left-map-controls" id="leftMapControls">
            <button type="button" id="zoomInBtn" class="map-ctrl-btn" aria-label="Zoom in">+</button>
            <button type="button" id="zoomOutBtn" class="map-ctrl-btn" aria-label="Zoom out">−</button>
            <button type="button" id="homeBtn" class="map-ctrl-btn" aria-label="Home">⌂</button>
        </div>

        <div class="map-controls">
            <button class="layers-btn" id="layersBtn" type="button" data-i18n-title="basemap.layersTitle" data-i18n-aria="basemap.layersAria" title="تغییر نوع نقشه" aria-label="انتخاب نوع نقشه" aria-expanded="false">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
                    <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l-10-5v10l10 5 10-5V6l-10 5z"/>
                </svg>
            </button>
            <div class="basemap-popup" id="basemapPopup" role="menu" hidden>
                <button type="button" class="basemap-option active" data-value="carto" role="menuitem">
                    <span class="basemap-swatch carto"></span>
                    <span data-i18n="basemap.carto">رنگارنگ (پیش‌فرض)</span>
                </button>
                <button type="button" class="basemap-option" data-value="persiangis" role="menuitem">
                    <span class="basemap-swatch persiangis"></span>
                    <span data-i18n="basemap.persiangis">نقشه فارسی</span>
                </button>
                <button type="button" class="basemap-option" data-value="satellite" role="menuitem">
                    <span class="basemap-swatch satellite"></span>
                    <span data-i18n="basemap.satellite">ماهواره‌ای</span>
                </button>
                <button type="button" class="basemap-option" data-value="light" role="menuitem">
                    <span class="basemap-swatch light"></span>
                    <span data-i18n="basemap.light">خاکستری روشن</span>
                </button>
                <button type="button" class="basemap-option" data-value="osm" role="menuitem">
                    <span class="basemap-swatch osm"></span>
                    <span data-i18n="basemap.osm">استاندارد (OSM)</span>
                </button>
            </div>
        </div>

        <div class="info-panel panel-peek" id="infoPanelWrapper">
            <div class="panel-header" id="panelHeader">
                <div class="drag-handle" id="dragHandle" aria-hidden="true"></div>
                <h1 data-i18n="header.title">WebGIS ایران</h1>
                <p data-i18n="header.subtitle">رنگ بر اساس سرانه جمعیت + پروژه‌های آموزشی</p>
            </div>
            <div class="panel-content" id="infoPanel">
                <div class="no-selection">
                    <div class="icon">🗺️</div>
                    <h3 data-i18n="empty.title">یک مورد را انتخاب کنید</h3>
                    <p data-i18n="empty.hint">روی استان، شهرستان یا پروژه کلیک کنید</p>
                </div>
            </div>
            <div class="fixed-contribute-button" id="fixedContributeBtn">
                <button type="button" id="contributeActionBtn" data-i18n="contribute.btn">مشارکت در ساخت</button>
                <p data-i18n="contribute.hint">(انتخاب شبکه و پرداخت با کیف پول)</p>
            </div>
        </div>
    </div>

    <script src="js/gis-i18n.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
    <script src="js/network-config.js"></script>
    <script src="js/raised-reader.js"></script>
    <!-- donor-reader.js intentionally omitted (not on Mobile); Script-GIS has loadDonors via Indexer API -->
    <script src="js/Script-GIS.js"></script>
    <script src="js/gis-basemap-fix.js"></script>
    <script>
    /* Harden donors list: resilient fetch + soft error (overrides Script-GIS loadDonors) */
    (function () {
        var INDEXER_API = window.CLASSCHAIN_INDEXER_API || 'https://classchain-indexer.classchain.workers.dev';

        function shortDonorAddr(addr) {
            if (!addr || typeof addr !== 'string') return '—';
            if (addr.length < 12) return addr;
            return addr.slice(0, 6) + '…' + addr.slice(-4);
        }

        function aggregateIndexerDonors(rows) {
            var map = new Map();
            (rows || []).forEach(function (row) {
                var key = String(row.donor || '').toLowerCase();
                if (!key) return;
                var amount = Number(row.amount) || 0;
                var prev = map.get(key);
                if (!prev) map.set(key, { donor: row.donor, total: amount, count: 1 });
                else { prev.total += amount; prev.count += 1; }
            });
            return Array.from(map.values()).sort(function (a, b) { return b.total - a.total; });
        }

        window.loadDonors = async function loadDonors(projectAttributes) {
            var el = document.getElementById('donorsList');
            if (!el) return;
            var projectId = String((projectAttributes && (projectAttributes.ProjectID || projectAttributes.projectId)) || '').trim();
            if (!projectId) { el.innerHTML = ''; return; }

            el.innerHTML = '<span class="info-label">' + (window.GisI18n && GisI18n.t ? GisI18n.t('donors.loading') : 'Loading contributors...') + '</span>';

            try {
                var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
                var timer = controller ? setTimeout(function () { controller.abort(); }, 20000) : null;
                var res = await fetch(
                    INDEXER_API + '/api/donors?projectId=' + encodeURIComponent(projectId),
                    {
                        headers: { Accept: 'application/json' },
                        mode: 'cors',
                        credentials: 'omit',
                        cache: 'no-store',
                        signal: controller ? controller.signal : undefined
                    }
                );
                if (timer) clearTimeout(timer);
                if (!res.ok) throw new Error('HTTP ' + res.status);

                var data = await res.json();
                var list = aggregateIndexerDonors(data.donors || []);

                if (!list.length) {
                    el.innerHTML = '<span class="info-label">' + (window.GisI18n && GisI18n.t ? GisI18n.t('donors.empty') : 'No contributions yet — you can be the first.') + '</span>';
                    return;
                }

                var rows = list.slice(0, 12).map(function (d) {
                    return '<div style="display:flex;justify-content:space-between;gap:8px;font-size:0.92em;padding:3px 0;">' +
                        '<span title="' + d.donor + '">' + shortDonorAddr(d.donor) + '</span>' +
                        '<span><strong>' + Number(d.total).toFixed(2) + '</strong> USDT</span></div>';
                }).join('');
                var more = list.length > 12
                    ? '<div style="opacity:.75;margin-top:4px;">' + (window.GisI18n && GisI18n.t ? GisI18n.t('donors.more', { count: list.length - 12 }) : ('and ' + (list.length - 12) + ' more…')) + '</div>'
                    : '';
                el.innerHTML = '<div class="info-label" style="margin-bottom:6px;">' + (window.GisI18n && GisI18n.t ? GisI18n.t('donors.title', { count: list.length }) : ('Contributors (' + list.length + ')')) + '</div>' + rows + more;
            } catch (e) {
                console.error('[WebGIS] Indexer donors failed:', e);
                el.innerHTML = '<span class="info-label">' + (window.GisI18n && GisI18n.t ? GisI18n.t('donors.unavailable') : 'Contributors list is temporarily unavailable.') + '</span>';
            }
        };
    })();
    </script>
</body>
</html>
