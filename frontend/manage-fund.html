<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت خزانه پروژه - کلاس‌چین</title>

    <!-- فونت‌ها -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- استایل جداگانه -->
    <link rel="stylesheet" href="css/manage-fund.css">

    <!-- Particles.js -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

    <!-- Web3 -->
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
</head>
<body>
    <div id="particles-js"></div>

    <div class="container">
        <h1>مدیریت خزانه پروژه</h1>

        <div id="loading" class="card">
            <p>در حال بارگذاری اطلاعات پروژه...</p>
        </div>

        <div id="main" style="display:none;">
            <div class="card">
                <h2 id="projectName">نام پروژه</h2>
                <div class="info-grid">
                    <div class="info-item">
                        <div class="info-label">موجودی خزانه (USDC)</div>
                        <div class="info-value" id="fundBalance">0</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">آدرس خزانه</div>
                        <div class="info-value" id="fundAddress">-</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">مالک (Multisig)</div>
                        <div class="info-value" id="ownerAddress">-</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">تعداد تأیید لازم</div>
                        <div class="info-value" id="requiredConfirmations">-</div>
                    </div>
                </div>

                <h3>صاحبان امضا</h3>
                <div id="ownersList" class="info-grid"></div>
            </div>

            <div class="card">
                <h3>تراکنش‌های در انتظار اجرا</h3>
                <div id="pendingTxs"></div>
            </div>

            <div class="card">
                <h3>برداشت جدید از خزانه</h3>
                <input type="number" id="withdrawAmount" placeholder="مقدار USDC (مثل 1.5)" step="0.01" min="0">
                <input type="text" id="withdrawTo" placeholder="آدرس مقصد (0x...)">
                <button onclick="submitWithdraw()">ثبت درخواست برداشت</button>
                <div id="status"></div>
            </div>
        </div>
    </div>

    <script src="js/manage-fund.js"></script>
</body>
</html>
