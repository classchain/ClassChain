<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت خزانه پروژه - کلاس‌چین</title>

    <!-- فونت‌ها -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- Particles.js -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

    <!-- Web3 -->
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>

    <style>
        :root {
            --bg: #0a0e17;
            --text: #f1f5f9;
            --primary: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body, html {
            min-height: 100vh;
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg);
            color: var(--text);
            position: relative;
        }
        #particles-js {
            position: fixed;
            width: 100%; height: 100%;
            top: 0; left: 0; z-index: 1;
            pointer-events: none;
        }
        .container {
            position: relative;
            z-index: 10;
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }
        .card {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }
        h1 { text-align: center; font-size: 2.2rem; margin-bottom: 1rem; background: linear-gradient(120deg, #4cc9f0, #8b5cf6); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin: 1.5rem 0;
        }
        .info-item {
            background: rgba(255,255,255,0.05);
            padding: 1rem;
            border-radius: 12px;
            text-align: center;
        }
        .info-label { opacity: 0.8; font-size: 0.9rem; }
        .info-value { font-size: 1.4rem; font-weight: bold; margin-top: 0.5rem; word-break: break-all; }
        .pending-tx {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid var(--warning);
            border-radius: 12px;
            padding: 1rem;
            margin: 1rem 0;
        }
        input, button {
            width: 100%;
            padding: 1rem;
            margin: 0.5rem 0;
            border-radius: 12px;
            border: none;
            font-size: 1rem;
        }
        input { background: rgba(255,255,255,0.1); color: white; }
        button {
            background: var(--primary);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover { background: #7c3aed; transform: translateY(-2px); }
        button.success { background: var(--success); }
        button.danger { background: var(--danger); }
        .status { padding: 1rem; border-radius: 12px; margin: 1rem 0; text-align: center; font-weight: bold; }
        .success { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .error { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
    </style>
</head>
<body>
    <div id="particles-js"></div>

    <div class="container">
        <h1>مدیریت خزانه پروژه</h1>

        <div id="loading" class="card">
            <p>در حال بارگذاری اطلاعات پروژه...</p>
        </div>

        <div id="main" style="display:none;">
            <div class="card">
                <h2 id="projectName">نام پروژه</h2>
                <div class="info-grid">
                    <div class="info-item">
                        <div class="info-label">موجودی خزانه (USDC)</div>
                        <div class="info-value" id="fundBalance">0</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">آدرس خزانه</div>
                        <div class="info-value" id="fundAddress">-</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">مالک (Multisig)</div>
                        <div class="info-value" id="ownerAddress">-</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">تعداد تأیید لازم</div>
                        <div class="info-value" id="requiredConfirmations">-</div>
                    </div>
                </div>

                <h3>صاحبان امضا</h3>
                <div id="ownersList" class="info-grid"></div>
            </div>

            <div class="card">
                <h3>تراکنش‌های در انتظار اجرا</h3>
                <div id="pendingTxs"></div>
            </div>

            <div class="card">
                <h3>برداشت جدید از خزانه</h3>
                <input type="number" id="withdrawAmount" placeholder="مقدار USDC (مثل 1.5)" step="0.01" min="0">
                <input type="text" id="withdrawTo" placeholder="آدرس مقصد (0x...)">
                <button onclick="submitWithdraw()">ثبت درخواست برداشت</button>
                <div id="status"></div>
            </div>
        </div>
    </div>

    <script src="js/manage-fund.js"></script>
</body>
</html>
