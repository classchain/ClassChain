<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشارکت در پروژه - کلاس‌چین</title>
    <script>
    (function () {
        var KEY = 'classchain-language';
        var lang = 'fa';
        try {
            var s = localStorage.getItem(KEY);
            if (s === 'en' || s === 'ar' || s === 'fa') lang = s;
        } catch (e) {}
        document.documentElement.lang = lang;
        document.documentElement.dir = (lang === 'en') ? 'ltr' : 'rtl';
        document.documentElement.setAttribute('data-lang', lang);
    })();
    </script>
    <style>
        html[data-lang]:not([data-lang="fa"]):not(.i18n-ready) [data-i18n] { visibility: hidden; }
        html.i18n-ready [data-i18n] { visibility: visible; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/donate.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@walletconnect/ethereum-provider@2.21.1/dist/index.umd.js"></script>
</head>
<body>
    <header class="donate-site-header" id="donateSiteHeader">
        <div class="donate-header-inner">
            <nav class="donate-nav">
                <div class="donate-nav-start">
                    <a href="../index.html" class="donate-brand" aria-label="خانه / ClassChain">
                        <span class="donate-brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 3.2 3 11h2.5v8.5h4.2V14h4.6v5.5h4.2V11H21L12 3.2z"/></svg></span>
                        <span class="donate-brand-text">کلاس‌چِین</span>
                    </a>
                </div>
                <div class="donate-nav-end">
                    <div class="donate-desktop-links donate-desktop-only">
                        <a href="WebGIS.html" class="donate-nav-link" data-i18n="nav.webgis">نقشه پروژه‌ها</a>
                        <a href="donate.html" class="donate-nav-link is-active" data-i18n="nav.cta">مشارکت</a>
                    </div>
                    <div class="donate-language-switcher">
                        <button class="donate-language-button" id="languageButton" type="button" aria-label="Language" aria-expanded="false">FA</button>
                        <div class="donate-language-menu" id="languageMenu">
                            <button type="button" data-language="fa">فارسی</button>
                            <button type="button" data-language="en">English</button>
                            <button type="button" data-language="ar">العربية</button>
                        </div>
                    </div>
                    <button class="donate-mobile-menu-button donate-mobile-only" id="mobileMenuButton" type="button" aria-label="Menu">☰</button>
                </div>
            </nav>
            <div class="donate-mobile-menu" id="mobileMenu">
                <a href="WebGIS.html" class="donate-mobile-menu-item" data-i18n="nav.webgis">نقشه پروژه‌ها</a>
                <a href="donate.html" class="donate-mobile-menu-item is-active" data-i18n="nav.cta">مشارکت</a>
            </div>
        </div>
    </header>

    <div class="main-container">
        <div class="card">
            <div class="main-content">
                <h1 id="projectTitle" data-i18n="project.loading">در حال بارگذاری پروژه...</h1>
                <p id="projectDesc"></p>
                <div class="progress-container">
                    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                    <p class="progress-text" id="progressText" data-i18n="progress.loading">در حال بارگذاری...</p>
                </div>
                <div class="donation-section">
                    <h2 data-i18n="donation.amountTitle">مبلغ مشارکت (USDT)</h2>
                    <input type="number" id="customAmount" data-i18n-placeholder="donation.amountPlaceholder" placeholder="مبلغ دلخواه" min="1" inputmode="decimal">
                </div>
                <div class="network-selector">
                    <h2 data-i18n="network.title">انتخاب شبکه</h2>
                    <select id="networkSelect" onchange="selectNetwork(this.value)"></select>
                </div>
                <div class="wallet-info" id="walletInfo" style="display:none;">
                    <p><span data-i18n="wallet.address">آدرس کیف پول شما:</span> <span id="userAddress"></span></p>
                </div>
                <div class="qr-section" id="qrSection" style="display:none;">
                    <h3 data-i18n="qr.title">اسکن QR برای پرداخت (TRON)</h3>
                    <div id="qrcode"></div>
                </div>
                <div class="terms">
                    <label><input type="checkbox" id="termsConsent"><span data-i18n="terms.consent">با شرایط و ضوابط موافقم</span></label>
                </div>
                <button class="connect-btn" id="connectBtn" disabled data-i18n="payment.connect">اتصال کیف پول و پرداخت</button>
                <div class="success-message" id="successMessage" style="display:none;">
                    <h3 id="paymentStatusTitle" data-i18n="payment.processing">در حال انجام پرداخت...</h3>
                    <p id="txHash"></p>
                </div>
            </div>
            <div class="sidebar">
                <div class="project-image" id="projectImage">
                    <img src="https://via.placeholder.com/400x300?text=Project" data-i18n-alt="project.imageAlt" alt="تصویر پروژه">
                </div>
                <div class="donors-list" id="donorsList"><p data-i18n="donors.loading">در حال بارگذاری کمک‌کنندگان...</p></div>
                <div class="email-subscribe">
                    <h3 data-i18n="subscribe.title">دریافت آپدیت پروژه</h3>
                    <input type="email" id="donorEmail" data-i18n-placeholder="subscribe.emailPlaceholder" placeholder="ایمیل شما">
                    <label><input type="checkbox" id="consent"><span data-i18n="subscribe.consent">موافقم آپدیت دریافت کنم</span></label>
                    <button type="button" onclick="saveEmail()" data-i18n="subscribe.submit">ثبت ایمیل</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    (function () {
        var SUPPORTED = ['fa', 'en', 'ar'];
        var I18N = {
            fa: { dir:'rtl', langName:'FA', 'nav.webgis':'نقشه پروژه‌ها', 'nav.cta':'مشارکت', 'project.loading':'در حال بارگذاری پروژه...', 'project.notFound':'پروژه یافت نشد', 'project.error':'خطا در بارگذاری پروژه', 'project.noName':'پروژه بدون نام', 'progress.loading':'در حال بارگذاری...', 'progress.reading':'در حال خواندن موجودی از زنجیره...', 'progress.unavailable':'خواندن موجودی خزانه امکان‌پذیر نیست.', 'donation.amountTitle':'مبلغ مشارکت (USDT)', 'donation.amountPlaceholder':'مبلغ دلخواه', 'network.title':'انتخاب شبکه', 'network.wallet':'کیف پول', 'network.inactive':'غیرفعال', 'wallet.address':'آدرس کیف پول شما:', 'qr.title':'اسکن QR برای پرداخت (TRON)', 'terms.consent':'با شرایط و ضوابط موافقم', 'payment.connect':'اتصال کیف پول و پرداخت', 'payment.selectNetwork':'ابتدا شبکه را انتخاب کنید', 'payment.inactive':'هنوز فعال نیست', 'payment.notReady':'هنوز راه‌اندازی نشده', 'payment.processing':'در حال انجام پرداخت...', 'donors.loading':'در حال بارگذاری کمک‌کنندگان...', 'subscribe.title':'دریافت آپدیت پروژه', 'subscribe.emailPlaceholder':'ایمیل شما', 'subscribe.consent':'موافقم آپدیت دریافت کنم', 'subscribe.submit':'ثبت ایمیل', 'project.imageAlt':'تصویر پروژه', 'errors.title':'خطا در ارسال تراکنش:', 'errors.cancelled':'تراکنش توسط شما لغو شد.', 'errors.insufficient':'موجودی کیف پول (گس یا توکن) کافی نیست.', 'errors.reverted':'تراکنش برگشت خورد. ممکن است قرارداد هنوز فعال نشده یا توکن مجاز نباشد.', 'errors.unknown':'خطای نامشخص', 'errors.approved':'Approve موفق بود:', 'errors.depositFailed':'اما مرحله واریز (Deposit) شکست خورد.', 'email.invalid':'لطفاً ایمیل معتبر وارد کنید و تأیید را بزنید', 'email.saved':'ایمیل شما ثبت شد! آپدیت‌های پروژه برایتان ارسال خواهد شد ❤️', 'progress.collected':'جمع شده'},
            en: { dir:'ltr', langName:'EN', 'nav.webgis':'Project Map', 'nav.cta':'Contribute', 'project.loading':'Loading project...', 'project.notFound':'Project not found', 'project.error':'Error loading project', 'project.noName':'Unnamed project', 'progress.loading':'Loading...', 'progress.reading':'Reading balance from chain...', 'progress.unavailable':'Unable to read treasury balance.', 'donation.amountTitle':'Contribution amount (USDT)', 'donation.amountPlaceholder':'Custom amount', 'network.title':'Select network', 'network.wallet':'Wallet', 'network.inactive':'inactive', 'wallet.address':'Your wallet address:', 'qr.title':'Scan QR to pay (TRON)', 'terms.consent':'I agree to the terms and conditions', 'payment.connect':'Connect wallet & pay', 'payment.selectNetwork':'Select a network first', 'payment.inactive':'is not active yet', 'payment.notReady':'treasury is not initialized yet', 'payment.processing':'Processing payment...', 'donors.loading':'Loading donors...', 'subscribe.title':'Get project updates', 'subscribe.emailPlaceholder':'Your email', 'subscribe.consent':'I agree to receive updates', 'subscribe.submit':'Save email', 'project.imageAlt':'Project image', 'errors.title':'Transaction error:', 'errors.cancelled':'Transaction was cancelled.', 'errors.insufficient':'Insufficient wallet balance (gas or token).', 'errors.reverted':'Transaction reverted. The contract may not be active or the token may not be allowed.', 'errors.unknown':'Unknown error', 'errors.approved':'Approve succeeded:', 'errors.depositFailed':'but the deposit step failed.', 'email.invalid':'Please enter a valid email and confirm consent.', 'email.saved':'Your email was saved! Project updates will be sent to you ❤️', 'progress.collected':'collected'},
            ar: { dir:'rtl', langName:'AR', 'nav.webgis':'خريطة المشاريع', 'nav.cta':'ساهم الآن', 'project.loading':'جارٍ تحميل المشروع...', 'project.notFound':'المشروع غير موجود', 'project.error':'خطأ في تحميل المشروع', 'project.noName':'مشروع بلا اسم', 'progress.loading':'جارٍ التحميل...', 'progress.reading':'جارٍ قراءة الرصيد من الشبكة...', 'progress.unavailable':'تعذر قراءة رصيد الخزينة.', 'donation.amountTitle':'مبلغ المساهمة (USDT)', 'donation.amountPlaceholder':'مبلغ مخصص', 'network.title':'اختر الشبكة', 'network.wallet':'المحفظة', 'network.inactive':'غير نشطة', 'wallet.address':'عنوان محفظتك:', 'qr.title':'امسح QR للدفع (TRON)', 'terms.consent':'أوافق على الشروط والأحكام', 'payment.connect':'اتصال المحفظة والدفع', 'payment.selectNetwork':'اختر الشبكة أولاً', 'payment.inactive':'غير نشطة بعد', 'payment.notReady':'الخزينة غير مهيأة بعد', 'payment.processing':'جارٍ تنفيذ الدفع...', 'donors.loading':'جارٍ تحميل المساهمين...', 'subscribe.title':'احصل على تحديثات المشروع', 'subscribe.emailPlaceholder':'بريدك الإلكتروني', 'subscribe.consent':'أوافق على تلقي التحديثات', 'subscribe.submit':'حفظ البريد', 'project.imageAlt':'صورة المشروع', 'errors.title':'خطأ في إرسال المعاملة:', 'errors.cancelled':'تم إلغاء المعاملة.', 'errors.insufficient':'رصيد المحفظة غير كافٍ (الغاز أو الرمز).', 'errors.reverted':'تم رفض المعاملة. قد لا يكون العقد مفعلاً أو قد لا يكون الرمز مسموحاً.', 'errors.unknown':'خطأ غير معروف', 'errors.approved':'نجحت الموافقة:', 'errors.depositFailed':'لكن فشلت خطوة الإيداع.', 'email.invalid':'يرجى إدخال بريد إلكتروني صالح وتأكيد الموافقة.', 'email.saved':'تم حفظ بريدك الإلكتروني! ستصلك تحديثات المشروع ❤️', 'progress.collected':'تم جمعه'}
        };
        window.ClassChainI18n = {
            getLang: function(){ return document.documentElement.getAttribute('data-lang') || 'fa'; },
            t: function(key){ var d=I18N[this.getLang()] || I18N.fa; return d[key] != null ? d[key] : (I18N.fa[key] != null ? I18N.fa[key] : key); },
            apply: function(lang){
                if (SUPPORTED.indexOf(lang) === -1) lang='fa';
                var d=I18N[lang];
                document.documentElement.lang=lang; document.documentElement.dir=d.dir; document.documentElement.setAttribute('data-lang',lang);
                document.querySelectorAll('[data-i18n]').forEach(function(el){ var k=el.getAttribute('data-i18n'); if(d[k]!=null) el.textContent=d[k]; });
                document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el){ var k=el.getAttribute('data-i18n-placeholder'); if(d[k]!=null) el.setAttribute('placeholder',d[k]); });
                document.querySelectorAll('[data-i18n-alt]').forEach(function(el){ var k=el.getAttribute('data-i18n-alt'); if(d[k]!=null) el.setAttribute('alt',d[k]); });
                var btn=document.getElementById('languageButton'); if(btn) btn.textContent=d.langName;
                try { localStorage.setItem('classchain-language',lang); } catch(e) {}
                document.documentElement.classList.add('i18n-ready');
            }
        };
        ClassChainI18n.apply(document.documentElement.getAttribute('data-lang') || 'fa');
        document.querySelectorAll('[data-language]').forEach(function(b){ b.addEventListener('click',function(){ ClassChainI18n.apply(b.getAttribute('data-language')); }); });
        var languageButton=document.getElementById('languageButton'), languageMenu=document.getElementById('languageMenu');
        if(languageButton && languageMenu) languageButton.addEventListener('click',function(e){ e.stopPropagation(); var open=languageMenu.classList.toggle('open'); languageButton.setAttribute('aria-expanded',open?'true':'false'); });
        var mobileMenuButton=document.getElementById('mobileMenuButton'), mobileMenu=document.getElementById('mobileMenu');
        if(mobileMenuButton && mobileMenu) mobileMenuButton.addEventListener('click',function(e){ e.stopPropagation(); mobileMenu.classList.toggle('open'); });
        document.addEventListener('click',function(){ if(languageMenu) languageMenu.classList.remove('open'); if(languageButton) languageButton.setAttribute('aria-expanded','false'); });
    })();
    </script>

    <script src="js/network-config.js"></script>
    <script src="js/wallet-manager.js"></script>
    <script src="js/raised-reader.js"></script>
    <script src="js/donate.js"></script>
</body>
</html>
