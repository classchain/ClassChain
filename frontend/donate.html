<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشارکت در پروژه - کلاس‌چین</title>
    <script>
    /* Apply saved language BEFORE first paint to avoid FA→EN flash */
    (function () {
        var KEY = 'classchain-language';
        var lang = 'fa';
        try {
            var s = localStorage.getItem(KEY);
            if (s === 'en' || s === 'ar' || s === 'fa') lang = s;
        } catch (e) {}
        document.documentElement.lang = lang;
        document.documentElement.dir = (lang === 'en') ? 'ltr' : 'rtl';
        document.documentElement.setAttribute('data-lang', lang);
    })();
    </script>
    <style>
        html[data-lang]:not([data-lang="fa"]):not(.i18n-ready) [data-i18n] { visibility: hidden; }
        html.i18n-ready [data-i18n] { visibility: visible; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/donate.css">

    <!-- QR Code -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <!-- Web3 -->
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
    <!-- WalletConnect v2 (EVM) -->
    <script src="https://cdn.jsdelivr.net/npm/@walletconnect/ethereum-provider@2.21.1/dist/index.umd.js"></script>
</head>
<body>

    <header class="donate-site-header" id="donateSiteHeader">
        <div class="donate-header-inner">
            <nav class="donate-nav">
                <div class="donate-nav-start">
                    <a href="../index.html" class="donate-brand" aria-label="خانه / ClassChain">
                        <span class="donate-brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 3.2 3 11h2.5v8.5h4.2V14h4.6v5.5h4.2V11H21L12 3.2z"/></svg></span>
                        <span class="donate-brand-text">کلاس‌چِین</span>
                    </a>
                </div>
                <div class="donate-nav-end">
                    <div class="donate-desktop-links donate-desktop-only">
                        <a href="WebGIS.html" class="donate-nav-link" data-i18n="nav.webgis">نقشه پروژه‌ها</a>
                        <a href="donate.html" class="donate-nav-link is-active" data-i18n="nav.cta">مشارکت</a>
                    </div>
                    <div class="donate-language-switcher">
                        <button class="donate-language-button" id="languageButton" type="button" aria-label="Language" aria-expanded="false">FA</button>
                        <div class="donate-language-menu" id="languageMenu">
                            <button type="button" data-lang="fa">فارسی</button>
                            <button type="button" data-lang="en">English</button>
                            <button type="button" data-lang="ar">العربية</button>
                        </div>
                    </div>
                    <button class="donate-mobile-menu-button donate-mobile-only" id="mobileMenuButton" type="button" aria-label="Menu">☰</button>
                </div>
            </nav>
            <div class="donate-mobile-menu" id="mobileMenu">
                <a href="WebGIS.html" class="donate-mobile-menu-item" data-i18n="nav.webgis">نقشه پروژه‌ها</a>
                <a href="donate.html" class="donate-mobile-menu-item is-active" data-i18n="nav.cta">مشارکت</a>
            </div>
        </div>
    </header>

    <script>
    /* Sync nav labels from localStorage before heavy scripts */
    (function () {
        var lang = document.documentElement.getAttribute('data-lang') || 'fa';
        var dict = {
            fa: { langName: 'FA', 'nav.webgis': 'نقشه پروژه‌ها', 'nav.cta': 'مشارکت' },
            en: { langName: 'EN', 'nav.webgis': 'Project Map', 'nav.cta': 'Contribute' },
            ar: { langName: 'AR', 'nav.webgis': 'خريطة المشاريع', 'nav.cta': 'ساهم الآن' }
        };
        var d = dict[lang] || dict.fa;
        document.querySelectorAll('[data-i18n]').forEach(function (el) {
            var k = el.getAttribute('data-i18n');
            if (d[k] != null) el.textContent = d[k];
        });
        var btn = document.getElementById('languageButton');
        if (btn) btn.textContent = d.langName;
        document.documentElement.classList.add('i18n-ready');
    })();
    </script>

    <div class="main-container">
        <div class="card">
            <div class="main-content">
                <h1 id="projectTitle">در حال بارگذاری پروژه...</h1>
                <p id="projectDesc"></p>

                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <p class="progress-text" id="progressText">در حال بارگذاری...</p>
                </div>

                <div class="donation-section">
                    <h2>مبلغ مشارکت (USDT)</h2>
                    <input type="number" id="customAmount" placeholder="مبلغ دلخواه" min="1" inputmode="decimal">
                </div>

                <div class="network-selector">
                    <h2>انتخاب شبکه</h2>
                    <select id="networkSelect" onchange="selectNetwork(this.value)"></select>
                </div>

                <div class="wallet-info" id="walletInfo" style="display:none;">
                    <p>آدرس کیف پول شما: <span id="userAddress"></span></p>
                </div>

                <div class="qr-section" id="qrSection" style="display:none;">
                    <h3>اسکن QR برای پرداخت (TRON)</h3>
                    <div id="qrcode"></div>
                </div>

                <div class="terms">
                    <label>
                        <input type="checkbox" id="termsConsent">
                        با شرایط و ضوابط موافقم
                    </label>
                </div>

                <button class="connect-btn" id="connectBtn" disabled>اتصال کیف پول و پرداخت</button>

                <div class="success-message" id="successMessage" style="display:none;">
                    <h3 id="paymentStatusTitle">در حال انجام پرداخت...</h3>
                    <p id="txHash"></p>
                </div>
            </div>

            <div class="sidebar">
                <div class="project-image" id="projectImage">
                    <img src="https://via.placeholder.com/400x300?text=تصویر+پروژه" alt="تصویر پروژه">
                </div>
                <div class="donors-list" id="donorsList">
                    <p>در حال بارگذاری کمک‌کنندگان...</p>
                </div>
                <div class="email-subscribe">
                    <h3>دریافت آپدیت پروژه</h3>
                    <input type="email" id="donorEmail" placeholder="ایمیل شما">
                    <label><input type="checkbox" id="consent">موافقم آپدیت دریافت کنم</label>
                    <button type="button" onclick="saveEmail()">ثبت ایمیل</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    /* Header language + mobile menu (aligned with gis-header.js) */
    (function () {
        var SUPPORTED = ['fa', 'en', 'ar'];
        var I18N = {
            fa: { dir: 'rtl', langName: 'FA', 'nav.webgis': 'نقشه پروژه‌ها', 'nav.cta': 'مشارکت' },
            en: { dir: 'ltr', langName: 'EN', 'nav.webgis': 'Project Map', 'nav.cta': 'Contribute' },
            ar: { dir: 'rtl', langName: 'AR', 'nav.webgis': 'خريطة المشاريع', 'nav.cta': 'ساهم الآن' }
        };

        function applyLang(lang) {
            if (!I18N[lang]) lang = 'fa';
            var d = I18N[lang];
            document.documentElement.lang = lang;
            document.documentElement.dir = d.dir;
            document.documentElement.setAttribute('data-lang', lang);
            document.querySelectorAll('[data-i18n]').forEach(function (el) {
                var k = el.getAttribute('data-i18n');
                if (d[k] != null) el.textContent = d[k];
            });
            var btn = document.getElementById('languageButton');
            if (btn) btn.textContent = d.langName;
            try { localStorage.setItem('classchain-language', lang); } catch (e) {}
            document.documentElement.classList.add('i18n-ready');
            var menu = document.getElementById('languageMenu');
            if (menu) menu.classList.remove('open');
            if (btn) btn.setAttribute('aria-expanded', 'false');
        }

        document.querySelectorAll('[data-lang]').forEach(function (b) {
            b.addEventListener('click', function () { applyLang(b.getAttribute('data-lang')); });
        });

        var languageButton = document.getElementById('languageButton');
        var languageMenu = document.getElementById('languageMenu');
        if (languageButton && languageMenu) {
            languageButton.addEventListener('click', function (e) {
                e.stopPropagation();
                var open = languageMenu.classList.toggle('open');
                languageButton.setAttribute('aria-expanded', open ? 'true' : 'false');
            });
        }

        var mobileMenuButton = document.getElementById('mobileMenuButton');
        var mobileMenu = document.getElementById('mobileMenu');
        if (mobileMenuButton && mobileMenu) {
            mobileMenuButton.addEventListener('click', function (e) {
                e.stopPropagation();
                mobileMenu.classList.toggle('open');
            });
        }

        document.addEventListener('click', function () {
            if (languageMenu) languageMenu.classList.remove('open');
            if (languageButton) languageButton.setAttribute('aria-expanded', 'false');
        });
    })();
    </script>

    <!-- اسکریپت‌های پرداخت و کیف پول -->
    <script src="js/network-config.js"></script>
    <script src="js/wallet-manager.js"></script>
    <script src="js/raised-reader.js"></script>
    <script src="js/donate.js"></script>
</body>
</html>
