<!-- admin/index.html -->
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت - ClassChain</title>

    <!-- ⚠️ Web3 باید قبل از ماژول‌ها بارگذاری شود -->
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
    
    <!-- ✨ Particles.js برای افکت پس‌زمینه -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <!-- ✨ کانتینر ذرات (پس‌زمینه) -->
    <div id="particles-js"></div>

    <div class="admin-container">
        <!-- هدر -->
        <header class="admin-header">
            <div class="logo">
                <span class="logo-icon">🏫</span>
                <span class="logo-text">ClassChain Admin</span>
            </div>
            <div class="header-actions">
                <span id="connectionStatus" class="status-badge">⏳ متصل نیستید</span>
                <button id="connectBtn" class="btn-connect">🔗 اتصال به شبکه</button>
            </div>
        </header>

        <div class="admin-body">
            <!-- سایدبار -->
            <aside class="sidebar">
                <nav class="sidebar-nav">
                    <a href="#" class="active" data-section="create">🏗️ ساخت خزانه</a>
                    <a href="#" data-section="projects">📋 پروژه‌ها</a>
                    <a href="#" data-section="settings">⚙️ تنظیمات</a>
                </nav>
            </aside>

            <!-- محتوای اصلی -->
            <main class="main-content">
                <!-- بخش ساخت خزانه -->
                <section id="section-create" class="section active">
                    <h2>🏗️ ساخت خزانه جدید</h2>

                    <!-- انتخاب شبکه -->
                    <div class="form-group">
                        <label>شبکه مورد نظر:</label>
                        <div class="network-tabs"></div>
                    </div>

                    <!-- اطلاعات پروژه -->
                    <div class="form-group">
                        <label>آیدی پروژه (ProjectID):</label>
                        <div class="input-group">
                            <input type="text" id="projectId" placeholder="مثل 1735" list="projectSuggestions">
                            <datalist id="projectSuggestions"></datalist>
                            <button onclick="window.checkProject()" class="btn-secondary">🔍 بررسی</button>                          
                        </div>
                    </div>

                    <!-- نوع مالکیت -->
                    <div class="form-group">
                        <label>نوع مالکیت:</label>
                        <div class="ownership-tabs">
                            <button class="ownership-tab active" data-type="single">👤 تک‌مالکی</button>
                            <button class="ownership-tab" data-type="multisig">👥 چندمالکی</button>
                        </div>
                    </div>

                    <!-- فیلدهای تک‌مالکی -->
                    <div id="singleOwnerFields" class="form-group">
                        <label>آدرس صاحب خزانه:</label>
                        <input type="text" id="singleOwnerAddress" placeholder="0x... یا T...">
                    </div>

                    <!-- فیلدهای چندمالکی -->
                    <div id="multisigFields" style="display:none;">
                        <div class="form-group">
                            <label>تعداد امضای لازم:</label>
                            <input type="number" id="requiredSigs" min="1" value="2">
                        </div>
                        <div class="form-group">
                            <label>آدرس‌های مالکان:</label>
                            <div id="ownersContainer">
                                <div class="owner-item">
                                    <input type="text" class="owner-input" placeholder="آدرس مالک ۱">
                                    <button onclick="this.parentElement.remove()" class="btn-remove">❌</button>
                                </div>
                            </div>
                            <button class="btn-add">➕ اضافه کردن مالک</button>
                        </div>
                    </div>

                    <!-- دکمه ساخت -->
                    <button class="btn-create">
                        🚀 ساخت خزانه
                    </button>

                    <!-- نتیجه -->
                    <div id="createResult" style="display:none;"></div>
                </section>

                <!-- بخش پروژه‌ها -->
                <section id="section-projects" class="section" style="display:none;">
                    <div class="section-header">
                        <h2>📋 لیست پروژه‌ها</h2>
                        <div class="filters">
                            <select id="networkFilter">
                                <option value="all">همه شبکه‌ها</option>
                            </select>
                            <button onclick="window.loadProjectsTable()" class="btn-secondary">🔄 Refresh</button>
                        </div>
                    </div>
                    
                    <div class="table-wrapper">
                        <table id="projectsTable">
                            <thead>
                                <!-- هدر توسط JS ساخته می‌شود -->
                            </thead>
                            <tbody>
                                <!-- داده‌ها توسط JS پر می‌شود -->
                            </tbody>
                            <tfoot>
                                <!-- آمار توسط JS پر می‌شود -->
                            </tfoot>
                        </table>
                    </div>
                </section>

                <!-- بخش تنظیمات -->
                <section id="section-settings" class="section" style="display:none;">
                    <h2>⚙️ تنظیمات</h2>
                    <div class="settings-group">
                        <h3>🔑 توکن GitHub</h3>
                        <p style="color:#666;font-size:13px;">برای آپلود خودکار JSON به GitHub نیاز است</p>
                        <div style="display:flex;gap:10px;margin-top:10px;">
                            <input type="password" id="githubToken" placeholder="توکن GitHub را وارد کنید">
                            <button onclick="saveGitHubToken()">💾 ذخیره</button>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- ⚠️ اسکریپت‌ها در انتهای body -->
    <script type="module" src="js/app.js"></script>

    <!-- توابع کمکی برای استفاده در HTML -->
    <script>
        // توابع کمکی که در HTML استفاده می‌شوند
        function saveGitHubToken() {
            const input = document.getElementById('githubToken');
            if (input && input.value) {
                localStorage.setItem('github_token', input.value);
                alert('✅ توکن ذخیره شد!');
                input.value = '';
            } else {
                alert('❌ لطفاً توکن را وارد کنید');
            }
        }

        // مدیریت ناوبری سایدبار
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.sidebar-nav a').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    document.querySelectorAll('.sidebar-nav a').forEach(l => l.classList.remove('active'));
                    this.classList.add('active');

                    const section = this.dataset.section;
                    document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
                    const target = document.getElementById(`section-${section}`);
                    if (target) target.style.display = 'block';
                });
            });
        });

        // ============================================
        // ✨ راه‌اندازی Particles.js
        // ============================================
        particlesJS('particles-js', {
            particles: {
                number: { 
                    value: 80, 
                    density: { 
                        enable: true, 
                        value_area: 800 
                    } 
                },
                color: { 
                    value: '#8b5cf6' 
                },
                shape: { 
                    type: 'circle' 
                },
                opacity: { 
                    value: 0.3, 
                    random: true 
                },
                size: { 
                    value: 3, 
                    random: true 
                },
                move: { 
                    enable: true, 
                    speed: 2, 
                    direction: 'none', 
                    random: true,
                    straight: false,
                    out_mode: 'out'
                }
            },
            interactivity: {
                detect_on: 'canvas',
                events: {
                    onhover: { 
                        enable: true, 
                        mode: 'repulse' 
                    },
                    onclick: { 
                        enable: true, 
                        mode: 'push' 
                    }
                }
            },
            retina_detect: true
        });
    </script>
</body>
</html>
