<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت - ClassChain</title>
    <link rel="stylesheet" href="css/admin.css">
    <script type="module" src="js/app.js"></script>
</head>
<body>
    <div class="admin-container">
        <!-- هدر -->
        <header class="admin-header">
            <div class="logo">
                <span class="logo-icon">🏫</span>
                <span class="logo-text">ClassChain Admin</span>
            </div>
            <div class="header-actions">
                <span id="connectionStatus" class="status-badge">⏳ متصل نیستید</span>
                <button id="connectBtn" class="btn-connect">🔗 اتصال به شبکه</button>
            </div>
        </header>

        <div class="admin-body">
            <!-- سایدبار -->
            <aside class="sidebar">
                <nav class="sidebar-nav">
                    <a href="#" class="active" data-section="create">🏗️ ساخت خزانه</a>
                    <a href="#" data-section="projects">📋 پروژه‌ها</a>
                    <a href="#" data-section="settings">⚙️ تنظیمات</a>
                </nav>
            </aside>

            <!-- محتوای اصلی -->
            <main class="main-content">
                <!-- بخش ساخت خزانه -->
                <section id="section-create" class="section active">
                    <h2>🏗️ ساخت خزانه جدید</h2>
                    
                    <!-- انتخاب شبکه -->
                    <div class="form-group">
                        <label>شبکه مورد نظر:</label>
                        <div class="network-tabs"></div>
                    </div>

                    <!-- اطلاعات پروژه -->
                    <div class="form-group">
                        <label>آیدی پروژه (ProjectID):</label>
                        <div class="input-group">
                            <input type="text" id="projectId" placeholder="مثل 1735">
                            <button onclick="window.loadProjectsTable()" class="btn-secondary">🔍 بررسی</button>
                        </div>
                    </div>

                    <!-- نوع مالکیت -->
                    <div class="form-group">
                        <label>نوع مالکیت:</label>
                        <div class="ownership-tabs">
                            <button class="ownership-tab active" data-type="single">👤 تک‌مالکی</button>
                            <button class="ownership-tab" data-type="multisig">👥 چندمالکی</button>
                        </div>
                    </div>

                    <!-- فیلدهای تک‌مالکی -->
                    <div id="singleOwnerFields" class="form-group">
                        <label>آدرس صاحب خزانه:</label>
                        <input type="text" id="singleOwnerAddress" placeholder="0x... یا T...">
                    </div>

                    <!-- فیلدهای چندمالکی -->
                    <div id="multisigFields" style="display:none;">
                        <div class="form-group">
                            <label>تعداد امضای لازم:</label>
                            <input type="number" id="requiredSigs" min="1" value="2">
                        </div>
                        <div class="form-group">
                            <label>آدرس‌های مالکان:</label>
                            <div id="ownersContainer">
                                <div class="owner-item">
                                    <input type="text" class="owner-input" placeholder="آدرس مالک ۱">
                                    <button onclick="this.parentElement.remove()" class="btn-remove">❌</button>
                                </div>
                            </div>
                            <button onclick="addOwnerField()" class="btn-add">➕ اضافه کردن مالک</button>
                        </div>
                    </div>

                    <!-- دکمه ساخت -->
                    <button class="btn-create">🚀 ساخت خزانه</button>

                    <!-- نتیجه -->
                    <div id="createResult" style="display:none;"></div>
                </section>

                <!-- بخش پروژه‌ها -->
                <section id="section-projects" class="section">
                    <div class="section-header">
                        <h2>📋 لیست پروژه‌ها</h2>
                        <div class="filters">
                            <select id="networkFilter" onchange="window.loadProjectsTable()">
                                <option value="all">همه شبکه‌ها</option>
                            </select>
                            <button onclick="window.loadProjectsTable()" class="btn-secondary">🔄 Refresh</button>
                        </div>
                    </div>

                    <div class="table-wrapper">
                        <table id="projectsTable">
                            <thead>
                                <tr>
                                    <th>ProjectID</th>
                                    <th>نام پروژه</th>
                                    <th>هدف (USDT)</th>
                                    <th>جمع‌آوری شده</th>
                                    <!-- ستون‌های داینامیک برای شبکه‌ها -->
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </section>

                <!-- بخش تنظیمات -->
                <section id="section-settings" class="section">
                    <h2>⚙️ تنظیمات</h2>
                    <div class="settings-group">
                        <h3>توکن GitHub</h3>
                        <input type="password" id="githubToken" placeholder="توکن GitHub را وارد کنید">
                        <button onclick="saveGitHubToken()">💾 ذخیره</button>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script>
        // توابع کمکی برای درون HTML
        function addOwnerField() {
            const container = document.getElementById('ownersContainer');
            const div = document.createElement('div');
            div.className = 'owner-item';
            div.innerHTML = `
                <input type="text" class="owner-input" placeholder="آدرس مالک جدید">
                <button onclick="this.parentElement.remove()" class="btn-remove">❌</button>
            `;
            container.appendChild(div);
        }

        function saveGitHubToken() {
            const token = document.getElementById('githubToken').value;
            if (token) {
                localStorage.setItem('github_token', token);
                alert('✅ توکن ذخیره شد!');
            }
        }

        // پر کردن select فیلتر شبکه
        document.addEventListener('DOMContentLoaded', () => {
            const filter = document.getElementById('networkFilter');
            const networks = [
                { id: 'polygon_amoy', name: 'Polygon Amoy' },
                { id: 'polygon_mainnet', name: 'Polygon Mainnet' },
                { id: 'ethereum_sepolia', name: 'Ethereum Sepolia' },
                { id: 'tron_nile', name: 'Tron Nile' }
            ];
            networks.forEach(n => {
                const option = document.createElement('option');
                option.value = n.id;
                option.textContent = n.name;
                filter.appendChild(option);
            });
        });
    </script>
</body>
</html>
