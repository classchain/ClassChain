name: Apply D1 migrations

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.142.0 d1 migrations apply classchain-indexer --remote --config wrangler.jsonc

      - name: Verify Telegram project 8207
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4.142.0 d1 execute classchain-indexer --remote
          --config wrangler.jsonc
          --command="SELECT kind, project_id, chat_id, title, active FROM telegram_groups WHERE kind = 'PROJECT' AND project_id = '8207';"
